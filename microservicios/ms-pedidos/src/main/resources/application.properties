server.port=${SERVER_PORT:8083}
spring.application.name=ms-pedidos
spring.datasource.url=jdbc:h2:mem:pedidosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.productos.url=${PRODUCTOS_URL:}
app.jwt.secret=${JWT_SECRET:desarrollo-solo-local-cambiar-en-produccion-0123456789}
