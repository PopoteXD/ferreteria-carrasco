server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;

  location = /api/health {
    proxy_pass http://ms-productos:8081;
  }
  location ~ ^/api/(v1/)?(productos|ofertas)(/|$) {
    proxy_pass http://ms-productos:8081;
  }
  location ~ ^/api/(v1/)?(auth|usuarios|ubicaciones)(/|$) {
    proxy_pass http://ms-usuarios:8082;
  }
  location ~ ^/api/(v1/)?pedidos(/|$) {
    proxy_pass http://ms-pedidos:8083;
  }
  location ~ ^/api/(v1/)?contacto(/|$) {
    proxy_pass http://ms-contacto:8084;
  }
  location ~ ^/api/(v1/)?pagos(/|$) {
    proxy_pass http://ms-pagos:8085;
  }

  location / {
    try_files $uri /index.html;
  }
}
